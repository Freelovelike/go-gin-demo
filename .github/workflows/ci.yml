name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: true

    - name: Verify dependencies
      run: go mod verify

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

    - name: Run Tests
      run: go test -v ./...

    - name: Build Go App
      run: go build -v -o main .

    - name: Test Docker Build
      run: docker build -t go-gin-demo-app:test .

  deploy:
    name: Deploy to Server
    needs: build-and-test
    runs-on: ubuntu-latest
    # 只有当推送到 main 分支且前置检查通过时，才会执行部署
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # password: ${{ secrets.SERVER_PASSWORD }} # 如果你是用密码登录服务器，请把上一行 key 注释掉，并取消这行注释
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          rm: false # 设置为 true 会在拷贝前清空目标目录，建议先保持 false 以免误删 .env

      - name: Execute remote ssh commands to restart docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # password: ${{ secrets.SERVER_PASSWORD }} # 同上
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker-compose up -d --build
            docker image prune -f # 清理旧镜像释放空间
