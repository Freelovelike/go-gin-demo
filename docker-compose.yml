services:
  app:
    build: .
    container_name: qqfarm-app-${GIT_COMMIT:-latest}
    image: qqfarm-app-img:${GIT_COMMIT:-latest}
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的 127.0.0.1，Docker 内部用服务名通信
      DB_DSN: host=postgres user=postgres password=postgres dbname=qqfarm port=5432 sslmode=disable TimeZone=Asia/Shanghai
      REDIS_ADDR: redis:6379
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qqfarm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    restart: always

volumes:
  pgdata:
  redisdata:
